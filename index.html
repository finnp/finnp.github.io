<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>finn pauls</title>
	<style>
		:root {
			--glass-background: rgba(237, 237, 230, 0.26);
			--glass-filter: blur(18px) saturate(140%);
		}

		article {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			background: url('finn.jpg') no-repeat center center;
			background-size: cover;
			font-family: 'Sen', sans-serif;
			isolation: isolate;
			margin: 25px;
			min-height: 100%;
			min-height: calc(100% - 50px);
			overflow: hidden;
			position: relative;
		}

		html,
		body {
			overflow: hidden;
			height: 100%;
			margin: 0;
		}

		body {
			background-color: #EDEDE6;
		}


		a {
			color: black;
		}

		.contact-links {
			display: flex;
			gap: 12px;
		}

		.contact-links a {
			display: inline-flex;
		}

		.contact-links svg {
			width: 24px;
			height: 24px;
		}

		.photo-credit {
			align-items: center;
			display: flex;
			gap: 6px;
		}

		.photo-credit svg {
			height: 18px;
			width: 18px;
		}

		.dot-grid {
			inset: 0;
			pointer-events: none;
			position: absolute;
			z-index: 0;
		}

		.background-glass {
			-webkit-backdrop-filter: var(--glass-filter);
			-webkit-mask-image: url('foreground-mask.svg');
			-webkit-mask-position: center;
			-webkit-mask-repeat: no-repeat;
			-webkit-mask-size: cover;
			backdrop-filter: var(--glass-filter);
			background-color: var(--glass-background);
			inset: 0;
			mask-image: url('foreground-mask.svg');
			mask-position: center;
			mask-repeat: no-repeat;
			mask-size: cover;
			pointer-events: none;
			position: absolute;
			z-index: 1;
		}

		h1 {
			margin-top: 0;
			margin-bottom: 0.15em;
			font-size: 3em;
			font-family: 'Moirai One', cursive;
			letter-spacing: normal;
		}

		h2 {
			margin-top: 0;
		}

		header, footer {
			background-color: var(--glass-background);
			-webkit-backdrop-filter: var(--glass-filter);
			backdrop-filter: var(--glass-filter);
			padding: 24px 18px;
			position: relative;
			z-index: 2;
		}

		header {
			width: 350px;
		}

		footer {
			align-self: flex-end;
			color: #C9C9C2;
			display: flex;
			flex-direction: column;
			gap: 4px;
			width: fit-content;
		}

		footer a {
			color: inherit;
		}

		@media (max-width: 400px) {
			header {
				width: 90%;
			}

			h2 {
				font-size: 1.2em;
			}
		}
	</style>
	<link href="https://fonts.googleapis.com/css?family=Moirai+One|Sen&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
	<article>
		<canvas class="dot-grid" aria-hidden="true"></canvas>
		<div class="background-glass" aria-hidden="true"></div>
		<header>
			<h1>finn pauls</h1>
			<h2>engineering · product · design</h2>
			<div class="contact-links">
				<a href="mailto:ich@finnpauls.de" aria-label="Email Finn">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<rect width="20" height="16" x="2" y="4" rx="2" />
						<path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
					</svg>
				</a>
				<a href="https://www.linkedin.com/in/finnpauls/" target="_blank" rel="noopener noreferrer" aria-label="Finn Pauls on LinkedIn">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
						<rect width="4" height="12" x="2" y="9" />
						<circle cx="4" cy="4" r="2" />
					</svg>
				</a>
			</div>
		</header>
		<footer>
			<div>½ of <a href="https://alexandfinn.com" target="_blank">alexandfinn</a></div>
			<div class="photo-credit">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
					<circle cx="12" cy="13" r="3" />
				</svg>
				<span>by <a href="https://marialouceiro.com" target="_blank" rel="noopener noreferrer">marialouceiro</a></span>
			</div>
		</footer>
	</article>
	<script>
		const article = document.querySelector('article');
		const canvas = document.querySelector('.dot-grid');
		const context = canvas.getContext('2d');
		const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
		const photo = {
			width: 3840,
			height: 2683
		};
		const mask = {
			width: 960,
			height: 671,
			pixels: null
		};
		const maskImage = new Image();
		const pointer = {
			x: -1000,
			y: -1000,
			targetX: -1000,
			targetY: -1000,
			influence: 0,
			targetInfluence: 0
		};
		const grid = {
			gap: 32,
			radius: 4,
			warpRadius: 180,
			warpStrength: 44
		};
		let width = 0;
		let height = 0;
		let animationFrame = null;

		maskImage.addEventListener('load', () => {
			const maskCanvas = document.createElement('canvas');
			const maskContext = maskCanvas.getContext('2d', { willReadFrequently: true });
			maskCanvas.width = mask.width;
			maskCanvas.height = mask.height;
			maskContext.drawImage(maskImage, 0, 0, mask.width, mask.height);
			mask.pixels = maskContext.getImageData(0, 0, mask.width, mask.height).data;
			startAnimation();
		});
		maskImage.src = 'foreground-mask.svg';

		function resizeCanvas() {
			const bounds = article.getBoundingClientRect();
			const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
			width = bounds.width;
			height = bounds.height;
			canvas.width = Math.round(width * pixelRatio);
			canvas.height = Math.round(height * pixelRatio);
			canvas.style.width = `${width}px`;
			canvas.style.height = `${height}px`;
			context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
			startAnimation();
		}

		function isForeground(canvasX, canvasY) {
			if (!mask.pixels) {
				return true;
			}

			const scale = Math.max(width / photo.width, height / photo.height);
			const renderedWidth = photo.width * scale;
			const renderedHeight = photo.height * scale;
			const imageX = (canvasX - (width - renderedWidth) / 2) / scale;
			const imageY = (canvasY - (height - renderedHeight) / 2) / scale;
			const maskX = Math.max(0, Math.min(mask.width - 1,
				Math.floor(imageX / photo.width * mask.width)));
			const maskY = Math.max(0, Math.min(mask.height - 1,
				Math.floor(imageY / photo.height * mask.height)));
			const alpha = mask.pixels[(maskY * mask.width + maskX) * 4 + 3];

			return alpha < 230;
		}

		function dotTouchesForeground(x, y, radius) {
			const sampleRadius = radius + 1;
			const samples = [
				[0, 0],
				[sampleRadius, 0],
				[-sampleRadius, 0],
				[0, sampleRadius],
				[0, -sampleRadius],
				[sampleRadius * 0.7, sampleRadius * 0.7],
				[-sampleRadius * 0.7, sampleRadius * 0.7],
				[sampleRadius * 0.7, -sampleRadius * 0.7],
				[-sampleRadius * 0.7, -sampleRadius * 0.7]
			];

			return samples.some(([offsetX, offsetY]) =>
				isForeground(x + offsetX, y + offsetY));
		}

		function drawGrid() {
			context.clearRect(0, 0, width, height);
			context.fillStyle = '#000';

			for (let y = grid.gap / 2; y < height; y += grid.gap) {
				for (let x = grid.gap / 2; x < width; x += grid.gap) {
					const deltaX = x - pointer.x;
					const deltaY = y - pointer.y;
					const distance = Math.hypot(deltaX, deltaY);
					const falloff = Math.max(0, 1 - distance / grid.warpRadius);
					const nearCursorDamping = Math.min(distance / 32, 1);
					const warp = falloff * falloff * nearCursorDamping
						* grid.warpStrength * pointer.influence;
					const directionX = distance ? deltaX / distance : 0;
					const directionY = distance ? deltaY / distance : 0;
					const dotX = x + directionX * warp;
					const dotY = y + directionY * warp;
					const dotRadius = grid.radius + falloff * pointer.influence * 1.5;

					if (dotTouchesForeground(dotX, dotY, dotRadius)) {
						continue;
					}

					context.beginPath();
					context.arc(dotX, dotY, dotRadius, 0, Math.PI * 2);
					context.fill();
				}
			}
		}

		function animate() {
			pointer.x += (pointer.targetX - pointer.x) * 0.12;
			pointer.y += (pointer.targetY - pointer.y) * 0.12;
			pointer.influence += (pointer.targetInfluence - pointer.influence) * 0.12;
			drawGrid();

			const pointerIsMoving = Math.abs(pointer.targetX - pointer.x) > 0.1
				|| Math.abs(pointer.targetY - pointer.y) > 0.1;
			const influenceIsChanging = Math.abs(pointer.targetInfluence - pointer.influence) > 0.001;

			if (pointerIsMoving || influenceIsChanging) {
				animationFrame = window.requestAnimationFrame(animate);
			} else {
				animationFrame = null;
			}
		}

		function startAnimation() {
			if (animationFrame === null) {
				animationFrame = window.requestAnimationFrame(animate);
			}
		}

		if (!reducedMotion) {
			article.addEventListener('pointermove', (event) => {
				const bounds = article.getBoundingClientRect();
				const pointerWasInactive = pointer.targetInfluence === 0 && pointer.influence < 0.01;
				pointer.targetX = event.clientX - bounds.left;
				pointer.targetY = event.clientY - bounds.top;

				if (pointerWasInactive) {
					pointer.x = pointer.targetX;
					pointer.y = pointer.targetY;
				}

				pointer.targetInfluence = 1;
				startAnimation();
			});

			article.addEventListener('pointerleave', () => {
				pointer.targetInfluence = 0;
				startAnimation();
			});
		}

		new ResizeObserver(resizeCanvas).observe(article);
		resizeCanvas();
	</script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>finn pauls</title>
	<style>
		article {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			background: url('finn.jpg') no-repeat center center fixed;
			background-size: cover;
			font-family: 'Sen', sans-serif;
			margin: 25px;
			min-height: 100%;
			min-height: calc(100% - 50px);
		}

		html,
		body {
			overflow: hidden;
			height: 100%;
			margin: 0;
		}

		body {
			background-color: #EDEDE6;
		}


		a {
			color: black;
		}

		.contact-links {
			display: flex;
			gap: 12px;
		}

		.contact-links a {
			display: inline-flex;
		}

		.contact-links svg {
			width: 24px;
			height: 24px;
		}

		h1 {
			margin-top: 0;
			margin-bottom: 0.15em;
			font-size: 3em;
			font-family: 'Moirai One', cursive;
			letter-spacing: normal;
		}

		h2 {
			margin-top: 0;
		}

		header, footer {
			background-color: rgba(237, 237, 230, 0.26);
			-webkit-backdrop-filter: blur(18px) saturate(140%);
			backdrop-filter: blur(18px) saturate(140%);
			padding: 24px 18px;
		}

		header {
			width: 350px;
		}

		footer {
			align-self: flex-end;
			width: fit-content;
		}

		@media (max-width: 400px) {
			header {
				width: 90%;
			}

			h2 {
				font-size: 1.2em;
			}
		}
	</style>
	<link href="https://fonts.googleapis.com/css?family=Moirai+One|Sen&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
	<article>
		<header>

			<div class="contact-links">

						<rect width="20" height="16" x="2" y="4" rx="2" />
